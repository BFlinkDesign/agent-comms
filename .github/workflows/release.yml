# release — publish fleetd for every machine in the fleet.
#
# Actions > release > Run workflow, on main, with a new version such as
# fleetd-v0.1.0. Nothing else starts a release, so every release is a commit that
# passed review on main. The job refuses a version whose tag already exists,
# tests the commit, builds every fleet target with the version stamped in, and
# installs those exact files on this Windows runner with install-fleetd.ps1.
# Only then does it publish them, create the tag on the tested commit, and
# install the published release from GitHub the way the runbook tells a person to:
#   gh release download fleetd-v0.1.0 -R BFlinkDesign/agent-comms -p install-fleetd.ps1 -D $env:TEMP --clobber
#   powershell -ExecutionPolicy Bypass -File "$env:TEMP\install-fleetd.ps1" -Version fleetd-v0.1.0
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release tag, e.g. fleetd-v0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version }}
    # The token is given only to the steps that call GitHub; the test and build
    # steps, which run the repository's Go code, do not get it. The last step
    # does run install-fleetd.ps1 with it, and every step here runs code from
    # main, which only reviewed changes reach.
    steps:
      - name: Check the version is well formed and new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^fleetd-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like fleetd-v1.2.3, got '$TAG'"
            exit 1
          fi
          # matching-refs returns every tag that starts with the name, so only an
          # exact match counts.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")"
          if [ "$existing" != "0" ]; then
            echo "::error::$TAG already exists; release a new version instead"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the commit being released
        shell: bash
        run: go test -count=1 ./...

      - name: Build every fleet target
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/fleetd-$os-$arch$ext" ./cmd/fleetd
          done
          ./dist/fleetd-windows-amd64.exe version
          cp scripts/install-fleetd.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Install these exact files before publishing them
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-fleetd.ps1 -Version $env:TAG -From dist -Destination "$env:RUNNER_TEMP\before-publish"
          exit $LASTEXITCODE

      - name: Publish the release and tag the tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "fleetd built from ${GITHUB_SHA} after its tests passed and it installed on Windows. On Windows, download install-fleetd.ps1 from this release and run it with -Version ${TAG}; it checks the binary against SHA256SUMS before installing. Elsewhere, download the binary for your platform and run sha256sum --check --ignore-missing SHA256SUMS. \`fleetd version\` prints ${TAG}."

      - name: Install the published release as the runbook says
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern install-fleetd.ps1 --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\install-fleetd.ps1" -Version $env:TAG -Repo $env:GITHUB_REPOSITORY -Destination "$env:RUNNER_TEMP\bin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\bin\fleetd.exe" version
          exit $LASTEXITCODE
