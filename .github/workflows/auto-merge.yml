# Merge only the head whose files this run inspected.
# Uses SHA-pinned immediate merges after two all-green reads. It never enables
# persistent native auto-merge, which can survive a later writer push.
# PR code is never checked out or executed here. Guarded CI and runner changes
# require a manual merge. Branch protection still enforces the required checks.
# Hold/draft/base are re-read before merging; labels are not an atomic server lock.
name: auto-merge

on: # zizmor: ignore[dangerous-triggers] never checks out or executes pull request code
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, edited, labeled, unlabeled]

permissions: {}

jobs:
  auto-merge:
    # Same-repository PRs only: fork PRs are never merged automatically, and
    # Dependabot-triggered runs get a read-only token. A draft runs only to switch
    # auto-merge off, an edit only when the base branch changed, and a label change
    # only when it is a hold label; skipped jobs cost no Actions minutes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.draft == false || github.event.action == 'converted_to_draft') &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (
        !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
        contains(fromJSON('["hold","do-not-merge"]'), github.event.label.name)
      )
    # Per pull request, the newest event wins. Declared on the job rather than the
    # workflow so that a run whose job is skipped cannot cancel one that is running.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.admit.outputs.ready }}
      head: ${{ steps.admit.outputs.head }}
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: admit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require('./.github/scripts/auto-merge.cjs')({
              github, context, core, admissionOnly: true,
            });

  merge-inspected-head:
    needs: auto-merge
    if: needs.auto-merge.outputs.ready == 'true'
    concurrency:
      group: merge-inspected-head-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          INSPECTED_HEAD: ${{ needs.auto-merge.outputs.head }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.cjs')({
              github, context, core, expectedHead: process.env.INSPECTED_HEAD,
            });
